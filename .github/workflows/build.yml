name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore SepDownloadManager.sln

    - name: Build
      run: msbuild SepDownloadManager.sln /p:Configuration=Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SepDownloadManager
        path: SepDownloadManager/bin/Release/

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.${{ github.run_number }}
        name: Release v2.${{ github.run_number }}
        files: SepDownloadManager/bin/Release/SepDownloadManager.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
